<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3cc9b0"/>
      <stop offset="1" stop-color="#178f7d"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#deddda"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7e5e2"/>
      <stop offset="1" stop-color="#c0bfbc"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.38" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#9aede0"/>
      <stop offset="1" stop-color="#1d8f7f"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#tile)"/>
  <rect x="8" y="8" width="112" height="56" rx="26" fill="#ffffff" opacity="0.10"/>

  <!-- soft shadow under the instrument -->
  <ellipse cx="72" cy="112" rx="32" ry="3.6" fill="#083f3a" opacity="0.35"/>

  <!-- curved arm (behind the tube): rises from the foot and bends
       left, cradling the head of the body tube -->
  <path d="M 94 102 C 99 74 92 52 74 42" fill="none" stroke="url(#metal)"
        stroke-width="10" stroke-linecap="round"/>

  <!-- focus knob on the arm -->
  <circle cx="96" cy="72" r="7" fill="#0e4a44"/>
  <circle cx="94" cy="70" r="2.6" fill="#3cc9b0" opacity="0.85"/>

  <!-- stage (attached to the arm) -->
  <rect x="36" y="80" width="38" height="7" rx="3.5" fill="url(#metal)"/>
  <rect x="36" y="80" width="38" height="3" rx="1.5" fill="#ffffff" opacity="0.55"/>

  <!-- specimen slide on the stage -->
  <rect x="50" y="76.5" width="16" height="3.5" rx="1.75" fill="#0e4a44" opacity="0.9"/>

  <!-- foot -->
  <rect x="46" y="102" width="58" height="12" rx="6" fill="url(#metal)"/>
  <rect x="52" y="102" width="46" height="4" rx="2" fill="#ffffff" opacity="0.5"/>

  <!-- inclined body tube -->
  <g transform="rotate(-16 60 46) translate(0 4)">
    <!-- eyepiece -->
    <rect x="55" y="10" width="11" height="14" rx="4" fill="#0e4a44"/>
    <circle cx="60.5" cy="15" r="3.4" fill="url(#glass)"/>
    <!-- tube -->
    <rect x="53" y="22" width="16" height="48" rx="7" fill="url(#body)"/>
    <rect x="56" y="24" width="4" height="42" rx="2" fill="#ffffff" opacity="0.6"/>
    <!-- nosepiece -->
    <rect x="57" y="70" width="8" height="9" rx="2.5" fill="url(#metal)"/>
  </g>
</svg>
