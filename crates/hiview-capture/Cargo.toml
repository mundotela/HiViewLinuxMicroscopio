[package]
name = "hiview-capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Video capture hardware layer for HiView (udev, GStreamer, V4L2)"

[lints]
workspace = true

[features]
# Test-only plumbing (AudioSource::Delayed / DelayedBin). Not compiled
# into the shipped library; enabled for this crate's own integration
# tests via the dev-dependency below.
test-support = []

[dependencies]
hiview-core.workspace = true
gst.workspace = true
gst-app.workspace = true
gst-video.workspace = true
udev.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true

[dev-dependencies]
tempfile.workspace = true
gst-pbutils.workspace = true
image.workspace = true
# Self-dependency so integration tests build the lib with the
# `test-support` feature enabled (cargo does not allow enabling
# features on the current package directly).
hiview-capture = { path = ".", features = ["test-support"] }
