[package]
name = "hiview-buttond"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "serviço do botão físico Snap do HiView (usbmon → soquete Unix)"

[lints]
workspace = true

[dependencies]
hiview-core.workspace = true
udev.workspace = true
nix.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt"] }

[dev-dependencies]
tempfile.workspace = true

# Debian package (cargo-deb, M11). Optional root helper for the
# microscope's physical Snap button (docs/ARCHITECTURE.md §6.10).
# The maintainer scripts and systemd/sysusers sources live in
# ./debian/ — they run as ROOT and are reviewed per CONVENTIONS §11.1.
[package.metadata.deb]
name = "hiview-buttond"
maintainer = "MundoTela Tecnologia <contato@mundotela.com.br>"
# DEP-5 copyright — points at common-licenses instead of embedding
# the full GPL text (lintian).
copyright = '''
Format: https://www.debian.org/doc/packaging-manuals/copyright-format/1.0/
Upstream-Name: hiview-buttond
Upstream-Contact: MundoTela Tecnologia <contato@mundotela.com.br>
Source: https://github.com/mundotela/HiViewLinuxMicroscopio

Files: *
Copyright: 2026 MundoTela Tecnologia
License: GPL-3+

License: GPL-3+
 This program is free software: you can redistribute it and/or modify
 it under the terms of the GNU General Public License as published by
 the Free Software Foundation, either version 3 of the License, or
 (at your option) any later version.
 .
 This program is distributed in the hope that it will be useful,
 but WITHOUT ANY WARRANTY; without even the implied warranty of
 MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE.  See the
 GNU General Public License for more details.
 .
 You should have received a copy of the GNU General Public License
 along with this program.  If not, see <https://www.gnu.org/licenses/>.
 .
 On Debian systems, the complete text of the GNU General Public
 License version 3 can be found in `/usr/share/common-licenses/GPL-3'.
'''
section = "utils"
priority = "optional"
changelog = "debian/changelog"
# $auto covers libc/libudev. The unit is enabled and started by the
# generated postinst fragment (systemd-units below).
depends = "$auto"
maintainer-scripts = "debian/"
# The workspace release profile keeps line tables for HiView's
# field backtraces — this daemon ships no dbgsym package, so the
# workspace Cargo.toml declares `strip = "symbols"` in
# [profile.release.package.hiview-buttond] instead (CI lintian:
# unstripped-binary-or-object).
# cargo-deb adds the single leading space itself — keep lines
# flush-left (lintian).
extended-description = """
Optional root helper for the HiView USB microscope's physical Snap
button. It reads the button's UVC interrupt packets via the kernel
usbmon interface and publishes PRESSED/RELEASED lines on a group-
readable unix socket (/run/hiview/button.sock), so the app sees
button events without root. Hardened systemd unit: no capabilities,
private network, strict filesystem.
"""
assets = [
    [
        "target/release/hiview-buttond",
        "usr/libexec/hiview-buttond",
        "755",
    ],
    [
        "../../data/modules-load.d/hiview.conf",
        "usr/lib/modules-load.d/hiview.conf",
        "644",
    ],
    [
        "../../data/sysusers.d/hiview.conf",
        "usr/lib/sysusers.d/hiview.conf",
        "644",
    ],
]

# Generated postinst fragments: daemon-reload + enable + start. The
# unit itself comes from ./debian/hiview-buttond.service.
[package.metadata.deb.systemd-units]
unit-name = "hiview-buttond"
enable = true
start = true
